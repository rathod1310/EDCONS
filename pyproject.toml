[project]
name = "edcons_foundry"
authors = [{ name = "Edcons (MKS) Castings", email = "info@edconscastings.com" }]
description = "Shop-floor and lab logs for a DI / CI foundry on ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"
